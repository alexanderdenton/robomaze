<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <script>
    (function () {
      const savedTheme = localStorage.getItem("robomaze-theme");
      const prefersDark = window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme =
        savedTheme || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include nav.html %}

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-maintainer">
        robomaze maintained by
        <a href="https://github.com/alexanderdenton">alexanderdenton</a>
      </p>
      <p class="footer-links">
        <a href="{{ '/teacher/' | relative_url }}">Teachers &amp; source</a>
        ·
        <a href="https://github.com/alexanderdenton/robomaze">GitHub repository</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
